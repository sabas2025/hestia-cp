name: Professional release checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: professional-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify locked Hestia repository key and live Ubuntu 26.04 signature
        shell: bash
        run: |
          set -euo pipefail
          trust_dir=$(mktemp -d)
          trap 'rm -rf "$trust_dir"' EXIT
          export GNUPGHOME="$trust_dir/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          key_hash=$(awk -F '\t' '$1=="key-hestia" {print $2}' install/assets.lock.tsv)
          key_url=$(awk -F '\t' '$1=="key-hestia" {print $3}' install/assets.lock.tsv)
          test "$key_url" = https://apt.hestiacp.com/pubkey.gpg
          curl --fail --silent --show-error --proto '=https' --max-time 30 "$key_url" -o "$trust_dir/key"
          printf '%s  %s\n' "$key_hash" "$trust_dir/key" | sha256sum -c -
          gpg --batch --yes --dearmor --output "$trust_dir/keyring.gpg" "$trust_dir/key"
          curl --fail --silent --show-error --proto '=https' --max-time 30 https://apt.hestiacp.com/dists/resolute/InRelease -o "$trust_dir/InRelease"
          gpgv --status-fd=1 --keyring "$trust_dir/keyring.gpg" "$trust_dir/InRelease"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install QA tools
        run: |
          sudo apt-get update
          sudo apt-get install -y php8.3-cli python3-qrcode python3-cryptography shellcheck zstd composer nginx openssh-server
          sudo mkdir -p /run/sshd
          npm ci --ignore-scripts --prefix professional/tests/browser
          professional/tests/browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Fetch exact Composer-locked TOTP library for the isolated test
        run: |
          mkdir -p .qa/twofactor
          git -C .qa/twofactor init
          git -C .qa/twofactor fetch --depth 1 https://github.com/RobThree/TwoFactorAuth.git 85408c4e775dba7c0802f2d928efd921d530bc5b
          git -C .qa/twofactor checkout --detach FETCH_HEAD
      - name: Mandatory tests without skipped checks
        run: |
          browser_path=$(node -e 'process.stdout.write(require("./professional/tests/browser/node_modules/playwright").chromium.executablePath())')
          sudo env PATH="$PATH" PHP_BINARY=/usr/bin/php8.3 SHELLCHECK_BINARY=/usr/bin/shellcheck NGINX_BINARY=/usr/sbin/nginx SSHD_BINARY=/usr/sbin/sshd \
            TWOFA_LIBRARY_ROOT="$GITHUB_WORKSPACE/.qa/twofactor/lib" \
            PLAYWRIGHT_MODULE="$GITHUB_WORKSPACE/professional/tests/browser/node_modules/playwright" \
            CHROME_BIN="$browser_path" /usr/bin/python3 professional/tests/run_checks.py --output /tmp/hestia-verification.json
      - name: Check advisories for locked dependencies
        run: |
          composer --working-dir=web/inc audit --locked --no-dev
          composer --working-dir=web/src audit --locked --no-dev
          npm audit --package-lock-only --ignore-scripts --audit-level=high
          npm audit --prefix src/deb/web-terminal --package-lock-only --ignore-scripts --audit-level=high
          npm audit --prefix professional/tests/browser --package-lock-only --ignore-scripts --audit-level=high
      - name: Validate build and documentation tools after dependency updates
        run: |
          npm ci --ignore-scripts
          npm run build
          npm run docs:test
          npm run docs:build
